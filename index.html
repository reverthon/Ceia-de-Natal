<style>
/* VOICE: carinhoso, festivo, de família; um app pequeno que parece cartão de Natal
   IDEA: a lista do grupo da família virando um cardápio de ceia com etiquetas de presente
   PICTURE: cabeçalho verde-pinheiro com estrelas e guirlanda; cada prato com foto ou ilustração em prato
   COLOUR/TYPE: verde-pinheiro dominante, vermelho-cereja de apoio, dourado de acento; Mountains of Christmas no título, Nunito no resto
   LAYOUT: coluna única de app (máx 560px), cabeçalho, filtros, cartões, botão flutuante, painel inferior */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f1,#08170f);--card:light-dark(#fff,#112619);--ink:light-dark(#14261b,#eef3ec);--mute:light-dark(#5d6f63,#9fb3a5);
--pine:#0f4a2c;--pine2:#0a3520;--red:#c0222f;--gold:#e0b04a;--line:light-dark(#e2e8e1,#24412f);--chip:light-dark(#e9f0e7,#24432f);--chipLine:light-dark(#cfdccd,#3b6a4e);--chipHover:light-dark(#dde8da,#2c5039);--ok:light-dark(#1d7a44,#5fd08f);--soft:light-dark(#eef3ec,#163120)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-bottom:110px}
header{position:relative;background:radial-gradient(120% 90% at 80% 0%,#1b6b40 0,var(--pine) 45%,var(--pine2) 100%);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 26px;border-radius:0 0 28px 28px;overflow:hidden}
header svg.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
h1{font:700 clamp(38px,11vw,50px)/1.02 "Mountains of Christmas",cursive;margin:0;position:relative;text-wrap:balance;color:#fff}
h1 span{color:var(--gold)}
.sub{position:relative;margin:6px 0 18px;color:#d6e8dc;font-weight:700}
.prog{position:relative;background:rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ring{width:58px;height:58px}
.prog b{font-size:20px;display:block;line-height:1.2}.prog small{color:#d6e8dc;font-size:14px}
.drink{margin:16px 16px 0;background:var(--card);border:1.5px dashed var(--gold);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;font-size:15px}
.drink svg{flex:none}
.who{margin:12px 16px 0;background:var(--card);border-radius:18px;padding:10px 12px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line)}
.who .mt{flex:1}.who b{display:block;font-size:16px;line-height:1.2}.who small{color:var(--mute);font-size:13px;font-weight:700}
.lnk{border:1.5px solid var(--chipLine);background:var(--chip);color:var(--ink);font:800 14px Nunito,sans-serif;border-radius:99px;padding:8px 14px;min-height:40px;cursor:pointer}
.hint{margin:-4px 0 4px;color:var(--mute);font-size:14px}.hint[hidden]{display:none}#other{margin:8px 0 0;color:var(--red);font-weight:700}
.op{color:var(--mute);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--chipLine);background:var(--chip);color:var(--ink);font:700 14px Nunito,sans-serif;padding:9px 14px;border-radius:99px;min-height:40px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
h2{font-size:14px;color:var(--mute);margin:18px 20px 8px;font-weight:800}
.list{display:grid;gap:12px;padding:0 16px}
.item{background:var(--card);border-radius:20px;padding:12px;display:grid;grid-template-columns:76px minmax(0,1fr) 32px;column-gap:14px;row-gap:12px;align-items:center;box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(0,0,0,.35);position:relative}
.ph{width:76px;height:76px;border-radius:16px;overflow:hidden;background:var(--soft)}
.ph img,.ph svg{width:100%;height:100%;object-fit:cover;display:block}
.hd h3{margin:0;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.more{align-self:start;display:grid;place-items:center;padding:0;border:1.5px solid var(--chipLine);background:var(--chip);color:var(--ink);font-weight:800;width:36px;height:36px;margin:0;border-radius:10px;cursor:pointer;font-size:20px;line-height:1}
.st{font-size:13px;font-weight:800;margin:3px 0 0}
.st.falta{color:var(--red)}.st.ok{color:var(--ok)}
.ppl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;align-items:center;padding-top:12px;border-top:1px solid var(--line)}
.p{border:1.5px solid var(--chipLine);background:var(--chip);color:var(--ink);font:700 14px Nunito,sans-serif;border-radius:99px;padding:3px 12px 3px 3px;height:38px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;max-width:100%;text-align:start;vertical-align:middle}
.p b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.p .av,.p .ini{flex:none}
.ini{display:inline-grid;place-items:center;border-radius:50%;background:light-dark(#0f4a2c,#2f8a52);color:#fff;font-weight:800;flex:none}
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.avs button{border:3px solid transparent;background:none;padding:0;border-radius:50%;cursor:pointer;aspect-ratio:1;display:grid;place-items:center;transition:transform .15s}
.avs button[aria-pressed=true]{border-color:var(--gold);transform:scale(1.08)}
.avs svg{width:100%;height:100%;display:block}.avs .ini{width:100%!important;height:100%!important;font-size:24px!important;display:grid}
.avn{margin:6px 0 0;font-size:14px;color:var(--mute);font-weight:700;text-align:center}
.p i{flex:none;font-style:normal;background:var(--gold);color:#3a2700;border-radius:99px;padding:0 7px;font-size:12px}
.p.me{background:var(--red);border-color:var(--red);color:#fff}
.p:hover,.lnk:hover,.chips button:hover,.step button:hover,.btn.sec:hover{background:var(--chipHover)}.p.me:hover{background:#a81c28}.chips button[aria-pressed=true]:hover{background:#a81c28}
.add{border:1.5px dashed var(--red);background:light-dark(#fff5f5,#2a1416);color:light-dark(#c0222f,#ff7a84);font:800 14px Nunito,sans-serif;border-radius:99px;padding:0 14px;height:38px;cursor:pointer;flex:none}
.empty{text-align:center;color:var(--mute);padding:30px 20px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 18px);background:var(--red);color:#fff;border:0;border-radius:99px;padding:15px 22px;font:800 16px Nunito,sans-serif;box-shadow:0 10px 24px -8px rgba(192,34,47,.7);cursor:pointer;display:flex;gap:8px;align-items:center}
.scrim{position:fixed;inset:0;background:rgba(5,15,9,.5);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;max-height:92vh;overflow:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:0 0 14px;font-size:21px}
label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
input,select{width:100%;font:600 16px Nunito,sans-serif;padding:12px 14px;border-radius:14px;border:1.5px solid var(--chipLine);background:var(--bg);color:var(--ink);min-height:48px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.step{display:flex;align-items:center;gap:10px}.step input{text-align:center;width:80px;flex:none}
.step button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--chipLine);background:var(--chip);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer}
.row{display:flex;gap:10px;margin:20px -20px 0;padding:12px 20px calc(env(safe-area-inset-bottom) + 4px);position:sticky;bottom:calc(-1 * (env(safe-area-inset-bottom) + 20px));background:var(--card);border-top:1px solid var(--line)}
.btn{flex:1;min-height:50px;border-radius:14px;border:0;font:800 16px Nunito,sans-serif;cursor:pointer;background:var(--pine);color:#fff}
.btn.sec{background:var(--chip);color:var(--ink);border:1.5px solid var(--chipLine)}.btn.danger{background:var(--red)}
.delx{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;margin-top:22px;min-height:48px;border-radius:14px;border:1.5px solid var(--red);background:none;color:var(--red);font:800 15px Nunito,sans-serif;cursor:pointer}
.cf{text-align:center;padding:8px 0 0}.cf .ic{width:64px;height:64px;border-radius:50%;background:light-dark(#fde8ea,#3a1418);display:grid;place-items:center;margin:0 auto 12px}.cf h4{margin-bottom:6px}.cf p{margin:0 0 4px;color:var(--mute)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);z-index:5;background:#14261b;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function saveMe(n,a){me=n;myAv=a;try{localStorage.setItem("ceia_nome",n);localStorage.setItem("ceia_av",a)}catch(e){}}
function lastAv(n){if(isMe(n)&&avOk(myAv))return myAv;const l=[...levar].reverse().find(x=>same(x.nome,n)&&avOk(x.av));return l?l.av:-1}
const dishArt=i=>{if(DISH[i.id])return DISH[i.id];const n=norm(i.nome);const k=KEYS.find(k=>n.includes(k[0]));return k?DISH[k[1]]:(ART[i.cat]||ART.outro)};
const svgw=x=>`<svg viewBox="0 0 92 92" aria-hidden="true">${x}</svg>`;

function dias(){const n=new Date(),a=new Date(2026,11,24);const d=Math.ceil((a-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
 return d>1?`24 de dezembro · faltam ${d} dias`:d==1?"É amanhã!":d==0?"É hoje! Feliz Natal!":"Feliz Natal!"}
$("sub").textContent=dias();

function total(id){return levar.filter(l=>l.item==id).reduce((s,l)=>s+(+l.qtd||0),0)}
function render(){
 const sorted=[...items].sort((a,b)=>(a.ordem??99)-(b.ordem??99)||String(a.nome).localeCompare(b.nome));
 const ok=sorted.filter(i=>total(i.id)>=(+i.meta||1)).length,n=sorted.length,p=n?Math.round(ok/n*100):0;
 $("arc").setAttribute("stroke-dasharray",`${p/100*151} 151`);$("pct").textContent=n?p+"%":"–";
 if(loaded){$("progT").textContent=n?(ok==n?"Tudo garantido!":`${ok} de ${n} itens garantidos`):"Lista vazia";
  const falt=sorted.filter(i=>total(i.id)<(+i.meta||1)).map(i=>i.nome);
  $("progS").textContent=falt.length?"Falta: "+falt.slice(0,3).join(", ")+(falt.length>3?` e mais ${falt.length-3}`:""):"Ninguém vai passar fome";}
 const mine=sorted.filter(i=>levar.some(l=>l.item==i.id&&isMe(l.nome))).length;
 renderMe(mine);
 const fl=[["todos","Todos"],["falta","Falta alguém"],["meus",mine?`Os meus (${mine})`:"Os meus"],...CATS.filter(c=>sorted.some(i=>(i.cat||"outro")==c[0]))];
 $("chips").innerHTML=fl.map(([k,t])=>`<button type="button" data-f="${k}" aria-pressed="${filtro==k}">${t}</button>`).join("");
 let vis=sorted;
 if(filtro=="falta")vis=vis.filter(i=>total(i.id)<(+i.meta||1));
 else if(filtro=="meus")vis=vis.filter(i=>levar.some(l=>l.item==i.id&&isMe(l.nome)));
 else if(filtro!="todos")vis=vis.filter(i=>(i.cat||"outro")==filtro);
 if(!loaded){return}
 if(!vis.length){$("out").innerHTML=`<p class="empty">${!n?"Nenhum item ainda. Toque em <b>Novo item</b> para começar.":filtro=="meus"?(me?"Você ainda não escolheu nada para levar.":"Toque em “Eu levo” em algum prato."):"Nada por aqui. Tudo certo!"}</p>`;return}
 const groups=filtro=="todos"||filtro=="falta"||filtro=="meus"?CATS.map(c=>[c[1],vis.filter(i=>(i.cat||"outro")==c[0])]).filter(g=>g[1].length):[[catName(filtro),vis]];
 $("out").innerHTML=groups.map(([g,arr])=>`<h2>${g}</h2><div class="list">${arr.map(card).join("")}</div>`).join("");
}
function card(i){
 const t=total(i.id),m=+i.meta||1,f=m-t,ls=levar.filter(l=>l.item==i.id).sort((a,b)=>(a.t||0)-(b.t||0));
 const a=dishArt(i),img=a.startsWith("<svg")?a:svgw(a);
 return `<article class="item"><div class="ph">${img}</div>
 <div class="hd"><h3>${m>1?m+" ":""}${esc(i.nome)}</h3><div class="st ${f>0?"falta":"ok"}">${f>0?(t?`Falta ${f} de ${m}`:"Ninguém ainda"):(t>m?`Completo · ${t} de ${m}`:"Completo")}</div></div>
 <button class="more" type="button" data-edit="${esc(i.id)}" aria-label="Editar ${esc(i.nome)}">⋯</button>
 <div class="ppl">${ls.map(l=>`<button type="button" class="p${isMe(l.nome)?" me":""}" data-l="${esc(l.id)}">${avOk(l.av)?avSvg(l.av,26):ini(l.nome,26)}<b>${esc(l.nome)}</b>${(+l.qtd||1)>1||m>1?`<i>${+l.qtd||1}</i>`:""}</button>`).join("")}<button type="button" class="add" data-levo="${esc(i.id)}">+ Eu levo</button></div></article>`;
}
function renderMe(mine){
 $("who").innerHTML=me?`${avOk(myAv)?avSvg(myAv,44):ini(me,44)}<div class="mt"><b>Olá, ${esc(me)}!</b><small>${mine?`Você vai levar ${mine} ${mine>1?"itens":"item"}`:"Você ainda não escolheu nada"}</small></div><button type="button" id="meBtn" class="lnk">Trocar</button>`
 :`<span class="ini" style="width:44px;height:44px;font-size:20px">?</span><div class="mt"><b>Quem é você?</b><small>Para destacar o que você vai levar</small></div><button type="button" id="meBtn" class="lnk">Escolher</button>`}
const avGrid=(sel,n)=>`<div class="avs" id="avs">${[-1,...AV.keys()].map(k=>`<button type="button" data-av="${k}" aria-pressed="${k==sel}" aria-label="${k<0?"Sem avatar":AV[k][0]}" title="${k<0?"Sem avatar":AV[k][0]}">${k<0?ini(n||"?",48):avSvg(k)}</button>`).join("")}</div><p class="avn" id="avn">${sel>=0?AV[sel][0]:"Sem avatar"}</p>`;
function meSheet(){
 selAv=myAv;
 open(`<h4>Quem é você?</h4><p class="hint">Fica salvo só neste celular. Serve para o filtro “Os meus” e para já vir preenchido.</p>
 <label for="nm">Seu nome</label><input id="nm" autocomplete="given-name" value="${esc(me)}" placeholder="Ex.: Fábio">
 <label>Seu avatar <span class="op">(opcional)</span></label>${avGrid(selAv,me)}
 <div class="row"><button class="btn sec" type="button" id="cx">Cancelar</button><button class="btn" type="button" id="sv">Salvar</button></div>`);
 $("cx").onclick=close;
 $("sv").onclick=async()=>{const nome=$("nm").value.trim();if(!nome){$("nm").focus();return}
  const old=me;saveMe(nome,selAv);
  const ch=levar.filter(l=>(old&&same(l.nome,old))||same(l.nome,nome)).filter(l=>l.av!==selAv||String(l.nome)!==nome);
  try{for(const l of ch)await db.collection("levar").doc(l.id).set({item:l.item,nome,qtd:Math.max(1,+l.qtd||1),av:selAv,t:l.t||Date.now()})}catch(e){err(e)}
  close();render();toast(`Pronto, ${nome}!`)};
}
const TRASH='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
function confirmView(title,msg,ok,back,fn){
 open(`<div class="cf"><div class="ic" style="color:var(--red)">${TRASH.replace('width="18" height="18"','width="30" height="30"')}</div><h4>${title}</h4><p>${msg}</p></div>
 <div class="row"><button class="btn sec" type="button" id="cx">Voltar</button><button class="btn danger" type="button" id="ok">${ok}</button></div>`);
 $("cx").onclick=back;$("ok").onclick=fn;
}
/* sheet */
function open(html){$("sheetBody").innerHTML=html;$("sheet").classList.add("on");$("scrim").classList.add("on");document.body.style.overflow="hidden";$("sheet").scrollTop=0;setTimeout(()=>{const f=$("sheetBody").querySelector("input:not([type=hidden])");if(f&&!f.value)f.focus()},260)}
function close(){$("sheet").classList.remove("on");$("scrim").classList.remove("on");document.body.style.overflow=""}
$("scrim").onclick=close;
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2400)}
const stepper=(v)=>`<div class="step"><button type="button" data-s="-1" aria-label="Menos">−</button><input id="q" type="number" inputmode="numeric" min="1" value="${v}"><button type="button" data-s="1" aria-label="Mais">+</button></div>`;

function levoSheet(itemId,l){
 const i=items.find(x=>x.id==itemId);if(!i)return;
 const nm0=l?String(l.nome??""):me;selAv=l?(avOk(l.av)?l.av:-1):lastAv(me);
 open(`<h4>${l?"Editar":"Quem leva"}: ${esc(i.nome)}</h4>
 <label for="nm">Nome</label><input id="nm" autocomplete="given-name" value="${esc(nm0)}" placeholder="Ex.: Fábio">
 <p class="hint" id="other" ${!me||isMe(nm0)?"hidden":""}>Anotando para outra pessoa. Seu nome neste celular continua “${esc(me)}”.</p>
 <label>Avatar <span class="op">(opcional)</span></label>${avGrid(selAv,nm0)}
 <label for="q">Quantidade</label>${stepper(l?Math.max(1,+l.qtd||1):1)}
 ${l?`<button class="delx" type="button" id="rm">${TRASH}Tirar ${esc(nm0)} deste prato</button>`:""}
 <div class="row"><button class="btn sec" type="button" id="cx">Cancelar</button><button class="btn" type="button" id="sv">Salvar</button></div>`);
 $("cx").onclick=close;
 if(l)$("rm").onclick=()=>confirmView(`Tirar ${esc(nm0)}?`,`${esc(nm0)} deixa de levar <b>${esc(i.nome)}</b>.`,"Sim, tirar",()=>levoSheet(itemId,l),()=>run(db.collection("levar").doc(l.id).delete(),"Removido"));
 $("sv").onclick=()=>{const nome=$("nm").value.trim().replace(/\s+/g," "),q=Math.max(1,Math.min(99,parseInt($("q").value)||1));if(!nome){$("nm").focus();return}
  if(isMe(nome)||(!me&&!l))saveMe(nome,selAv);
  else if(l&&isMe(l.nome))saveMe(nome,selAv);
  const dup=!l&&levar.find(x=>x.item==i.id&&same(x.nome,nome));
  if(dup){run(db.collection("levar").doc(dup.id).set({item:i.id,nome,qtd:Math.min(99,Math.max(1,+dup.qtd||1)+q),av:selAv,t:dup.t||Date.now()}),`${nome} já estava aqui: somei a quantidade`);return}
  const ref=l?db.collection("levar").doc(l.id):db.collection("levar").doc();
  run(ref.set({item:i.id,nome,qtd:q,av:selAv,t:l?.t||Date.now()}),l?"Atualizado":`Anotado: ${nome} leva ${i.nome}`)};
}
function itemSheet(it){
 open(`<h4>${it?"Editar item":"Novo item"}</h4>
 <label for="in">Nome do item</label><input id="in" value="${esc(it?.nome||"")}" placeholder="Ex.: Farofa">
 <label for="ic">Categoria</label><select id="ic">${CATS.map(c=>`<option value="${c[0]}"${(it?.cat||"principal")==c[0]?" selected":""}>${c[1]}</option>`).join("")}</select>
 <label for="q">Quantas unidades precisa</label>${stepper(it?.meta||1)}
 ${it?`<button class="delx" type="button" id="rm">${TRASH}Excluir este item da lista</button>`:""}
 <div class="row"><button class="btn sec" type="button" id="cx">Cancelar</button><button class="btn" type="button" id="sv">Salvar</button></div>`);
 $("cx").onclick=close;
 if(it)$("rm").onclick=()=>{const ls=levar.filter(l=>l.item==it.id);
  confirmView(`Excluir ${esc(it.nome)}?`,ls.length?`Os nomes de quem ia levar também saem da lista (${ls.map(l=>esc(l.nome)).join(", ")}).`:"O item sai da lista para todo mundo.","Sim, excluir",()=>itemSheet(it),
   ()=>(async()=>{for(const l of ls)await db.collection("levar").doc(l.id).delete();await db.collection("itens").doc(it.id).delete()})().then(()=>{close();toast("Item excluído")},err))};
 $("sv").onclick=async()=>{const nome=$("in").value.trim();if(!nome){$("in").focus();return}
  const id=it?.id||("i"+Date.now().toString(36));
  const data={nome,cat:$("ic").value,meta:Math.max(1,parseInt($("q").value)||1),ordem:it?.ordem??(Math.max(0,...items.map(x=>+x.ordem||0))+1)};
  try{await db.collection("itens").doc(id).set(data);close();toast(it?"Item atualizado":"Item adicionado")}catch(e){err(e)}};
}
let selAv=-1;
document.addEventListener("input",e=>{if(e.target.id!="nm")return;const v=e.target.value;
 const s=document.querySelector('#avs [data-av="-1"] .ini');if(s)s.textContent=(v.trim().charAt(0)||"?").toUpperCase();
 const o=$("other");if(o)o.hidden=!me||!v.trim()||isMe(v);
 if(o){const a=lastAv(v);if(a>=0&&a!==selAv)pickAv(a)}});
function pickAv(k){selAv=k;document.querySelectorAll("#avs button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.av===k));$("avn").textContent=k>=0?AV[k][0]:"Sem avatar"}

function run(p,msg){p.then(()=>{close();toast(msg)},err)}
function err(e){toast(e&&(e.code=="permission-denied"||e.code=="invalid_argument")?"Você não tem permissão para editar esta lista":"Não deu certo, tente de novo")}

document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.f){filtro=t.dataset.f;render();return}
 if(t.dataset.av!==undefined){pickAv(+t.dataset.av);return}
 if(t.dataset.s){const q=$("q");q.value=Math.max(1,(parseInt(q.value)||1)+ +t.dataset.s);return}
 if(!db&&(t.dataset.levo||t.dataset.l||t.dataset.edit||t.id=="fab"||t.id=="meBtn")){toast("A lista ainda está carregando");return}
 if(t.dataset.levo)levoSheet(t.dataset.levo);
 else if(t.dataset.l){const l=levar.find(x=>x.id==t.dataset.l);if(l)levoSheet(l.item,l)}
 else if(t.dataset.edit)itemSheet(items.find(x=>x.id==t.dataset.edit));
 else if(t.id=="fab")itemSheet(null);
 else if(t.id=="meBtn")meSheet();
});
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});

const SEED=[["bacalhau","Bacalhau","principal",1],["chester","Chester","principal",1],["peru","Peru","principal",1],["lombo","Lombo no molho madeira","principal",1],["arroz","Arroz de festa","acomp",1],["salpicao","Salpicão","acomp",1],["paogelado","Pão gelado","acomp",2],["salada","Salada verão","acomp",1],["frios","Tábua de frios","acomp",1],["rabanada","Rabanada","doce",1],["cuca","Cuca","doce",1],["pudim","Pudim","doce",1],["panetone","Panetone","doce",2],["pave","Pavê","doce",1]];
async function getDb(){
 try{
  if(!window.firebase||!FIREBASE_CONFIG||String(FIREBASE_CONFIG.projectId).includes("COLE"))return null;
  firebase.initializeApp(FIREBASE_CONFIG);const d=firebase.firestore();
  const meta=d.collection("meta").doc("app");
  meta.get().then(async m=>{if(m.exists)return;const b=d.batch();SEED.forEach((x,i)=>b.set(d.collection("itens").doc(x[0]),{nome:x[1],cat:x[2],meta:x[3],ordem:i+1}));b.set(meta,{criado:Date.now()});await b.commit()}).catch(()=>{});
  return d;
 }catch(e){console.error(e);return null}
}
(async()=>{
 const timer=setTimeout(()=>{if(!loaded&&(items.length||levar.length)){loaded=true;render();toast("Conexão lenta: a lista pode estar desatualizada")}else if(!loaded){$("out").innerHTML='<p class="empty">Não consegui carregar a lista agora. Verifique a internet e abra de novo.</p>';$("progT").textContent="Sem conexão"}},10000);
 db=await getDb();
 if(!db){clearTimeout(timer);$("out").innerHTML='<p class="empty">Falta configurar o Firebase neste arquivo (veja o topo do index.html).</p>';$("progT").textContent="Lista indisponível";$("progS").textContent="";return}
 let got={itens:0,levar:0};
 const done=()=>{if(got.itens&&got.levar){loaded=true;clearTimeout(timer)}render()};
 const sub=(name,fn)=>db.collection(name).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));if(!s.metadata.fromCache)got[name]=1;done()},()=>{got[name]=1;done()});
 sub("itens",a=>items=a);
 sub("levar",a=>levar=a);
})();
}
</script>
</body>
